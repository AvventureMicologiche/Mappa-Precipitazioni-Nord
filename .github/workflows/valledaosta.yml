name: Valle d'Aosta
on:
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Data da raccogliere (YYYY-MM-DD, lascia vuoto per oggi)'
        required: false
        default: ''
  # DISATTIVATO 26/7/2026: la VdA in mappa usa il Centro Funzionale reale
  # (collect-valledaosta-cf.js + valledaosta-cf.yml). Questo collector Open-Meteo
  # resta lanciabile a mano (workflow_dispatch) ma non gira più in automatico.
  # schedule:
  #   - cron: '30 0 * * *'
  #   - cron: '30 4 * * *'
  #   - cron: '30 8 * * *'
  #   - cron: '30 12 * * *'
  #   - cron: '30 16 * * *'
  #   - cron: '30 20 * * *'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Raccoglie dati Valle d'Aosta
        id: collect
        run: node .github/scripts/collect-valledaosta-gh.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
        continue-on-error: true
      - name: Retry 1
        if: steps.collect.outcome == 'failure'
        run: sleep 30 && node .github/scripts/collect-valledaosta-gh.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
        continue-on-error: true
      - name: Retry 2
        if: steps.collect.outcome == 'failure'
        run: sleep 60 && node .github/scripts/collect-valledaosta-gh.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
      - name: Commit e push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          mkdir -p data/valledaosta
          git add data/valledaosta/
          git diff --staged --quiet || git commit -m "valledaosta $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
