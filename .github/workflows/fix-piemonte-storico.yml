name: Fix Piemonte storico
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ri-scarica ultimi 15 giorni
        run: |
          for i in $(seq 15 -1 1); do
            DATE=$(date -d "$i days ago" +%Y-%m-%d)
            echo "=== Ri-scarico $DATE ==="
            DATE_OVERRIDE=$DATE node .github/scripts/collect-piemonte.js || echo "Skip $DATE (errore)"
            sleep 2
          done
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/piemonte/
          git diff --cached --quiet && echo "Nessuna modifica" || (git commit -m "fix piemonte: ricalcolati ultimi 15gg con sum(cum_rain_1h)" && git push)
