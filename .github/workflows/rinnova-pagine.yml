name: Rinnovo stagionale delle pagine di paese e di zona
on:
  workflow_dispatch:
  schedule:
    # OGNI MESE, il 2 (dal 1/11/2026, scheda 105 bis; prima quattro volte l'anno, il primo di marzo, giugno,
    # settembre e dicembre). Il trimestre veniva dai crediti di Netlify, che col sito su Cloudflare Pages non ci
    # sono piu': con un rinnovo ogni tre mesi il «mese piu' piovoso» restava indietro fino a tre mesi (il 1/11 era
    # agosto su 573 pagine, con ottobre appena finito). Il 2 e non il 1: il mese appena chiuso ha tutti i suoi file.
    # ⚠️ Non e' un cron a caso: dentro quelle pagine c'e' il «ritratto» del
    # pluviometro cotto nell'HTML (quanto ha piovuto in tutto l'archivio, il
    # giorno piu' bagnato, il mese piu' piovoso). Quei numeri non scadono —
    # ogni frase dichiara il suo periodo — ma invecchiano come utilita': a
    # ogni stagione l'archivio e' piu' lungo e il ritratto dice di piu'.
    # ⚠️ Dal 7/10/2026 il sito e' su Cloudflare Pages: il push del rinnovo non pubblica da solo, ma il giro
    # pagine-regione.yml del mattino dopo pubblica TUTTO main, quindi le pagine rinnovate (e data/paesi-*.json,
    # che la Function legge dai file del sito) vanno online entro un giorno (ottavo check, punto C, 21/10/2026).
    # Per averle subito si lancia pubblica-pages.js a mano. I millimetri di ieri
    # restano comunque nel javascript della pagina: cuocerli vorrebbe dire una
    # pubblicazione al giorno.
    # ⚠️ Il minuto e' scelto libero: alle 11 UTC partono solo i :45 e i :50.
    # ⚠️ DAL 2 AL 6, UNA VOLTA SOLA (2/11/2026, scheda 113). Il 2/11, primo turno in assoluto, GitHub era 6-8 ore
    # indietro e alle 15:48 italiane il giro non era ancora partito: con un cron solo al mese un salto dello scheduler
    # vuol dire un mese senza rinnovo, e nessuno se ne accorge. Ora prova cinque giorni; `gia-fatto` salta il cron se
    # questo mese (ora italiana) c'e' gia' un giro riuscito, a mano o da cron. Il lancio a mano gira sempre.
    - cron: '20 11 2-6 * *'
permissions:
  contents: write
  actions: read
# un cron in ritardo che arriva mentre gira il lancio a mano aspetta in fila, e poi lo salta `gia-fatto`
concurrency:
  group: rinnova-pagine
  cancel-in-progress: false
jobs:
  gia-fatto:
    runs-on: ubuntu-latest
    outputs:
      salta: ${{ steps.c.outputs.salta }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" != "schedule" ]; then echo "salta=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          gh api "repos/${{ github.repository }}/actions/workflows/rinnova-pagine.yml/runs?per_page=20" > runs.json
          node -e '
            const mese = d => new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Rome" }).format(new Date(d)).slice(0, 7);
            const ora = mese(Date.now()), io = String(process.env.GITHUB_RUN_ID);
            const fatti = require("./runs.json").workflow_runs.filter(r => String(r.id) !== io && r.conclusion === "success" && mese(r.created_at) === ora);
            console.log(fatti.length ? "questo mese gia fatto: run " + fatti.map(r => r.id + " (" + r.event + ")").join(", ") : "questo mese non ancora fatto");
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "salta=" + (fatti.length > 0) + "\n");
          '
  run:
    needs: gia-fatto
    if: needs.gia-fatto.outputs.salta != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Nessuna rete: legge i file di `data/` gia' nel checkout. Rigenera le 19
      # pagine funghi (da li' le altre prendono il foglio di stile), le 948 di
      # paese, le 114 zone funghi e le 114 zone piogge (con data/paesi-zone.json,
      # che legge /api/previsioni?zona=), e sposta la data della sitemap SOLO per
      # le famiglie che sono cambiate davvero.
      - name: Rigenera le pagine
        run: node .github/scripts/rinnova-pagine.js
      # Il commit non pubblica da solo: va online col giro pagine-regione.yml del mattino dopo, che pubblica tutto
      # main (per averlo subito: pubblica-pages.js a mano). Se non e' cambiato niente non si committa.
      # ⚠️ data/paesi-zone.json e data/paesi-localita/ vanno online solo con la pubblicazione: la Function li legge
      # dai file del sito, non da GitHub.
      - name: Commit e push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          # ⚠️ anche data/paesi-localita/ (i paesi di «Che tempo farà» delle pagine paese, dal 20/10/2026) e TUTTE le
          # sitemap (settimo check, bug 2): prima mancavano, una pagina paese nuova restava senza i suoi paesi
          # («Le previsioni dei paesi non rispondono») e una modifica non aggiunta bloccava il rebase del rinnovo intero
          git add funghi/ zone/ data/paesi-zone.json data/paesi-localita/ 'sitemap*.xml' .github/scripts/pagine-lastmod.json .github/scripts/pagine-impronte.json
          git diff --quiet || { echo "⚠️ file modificati NON aggiunti al commit:"; git status --short; }
          git diff --staged --quiet && { echo "Niente da committare."; exit 0; }
          git commit -m "rinnovo stagionale delle pagine di paese e di zona $(date -u +%Y-%m-%d)"
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then ok=1; break; fi
            echo "Push fallito (tentativo $i/5), retry tra 10s..."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          [ "$ok" = "1" ] || { echo "Push fallito dopo 5 tentativi"; exit 1; }
