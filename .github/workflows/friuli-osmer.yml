name: Friuli OSMER (pilota)
on:
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Data da raccogliere (YYYY-MM-DD, lascia vuoto per ieri+altroieri)'
        required: false
        default: ''
  schedule:
    # Dati REALI ARPA OSMER (archivio). Ogni run copre ieri + altroieri +
    # auto-riparazione (~5gg). Orari sfalsati da meteohub (xx:50),
    # valledaosta-cf (xx:15) e ticino, per ridurre i conflitti di push.
    # ⚠️ RISERVE DELLA SVEGLIA (27/10/2026, fase 1 dell'alleggerimento delle fonti): erano 7 run/giorno, nati
    # quando OSMER pubblicava ieri LENTAMENTE (copertura piena in 1-2 giorni). Misurato il 26-27/10: ieri ha gia'
    # 40 stazioni all'1 di notte e al massimo una in piu' in mattinata. I giri del mattino li lancia l'orologio su
    # Cloudflare (4:30 e 5:45 italiane); qui restano due passate, e l'auto-riparazione recupera le ore tardive.
    - cron: '35 9 * * *'
    - cron: '35 16 * * *'
permissions:
  contents: write
# ⚠️ IN FILA, MAI DUE INSIEME (5/10/2026): dal 5/10 l'orologio su Cloudflare lancia questo
# workflow anche lui, accanto ai cron di GitHub. Due giri insieme scriverebbero gli stessi
# file e il secondo fallirebbe al push. Cosi' il secondo aspetta che il primo finisca.
# GitHub tiene al massimo UN giro in attesa: se ne arriva un terzo, quello in attesa
# (identico) viene sostituito, quello in corso non si tocca mai.
# ⚠️ (19/10/2026, sesto check) NON era vero che il secondo «riparte dai dati del primo»:
# un giro in fila fa il checkout dello SHA fissato quando e' nato, non della punta di main,
# e il suo commit andava in conflitto. Ora riparte dalla punta grazie a `ref: main`.
concurrency:
  group: friuli-osmer
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    # tetto (21/10/2026): una fonte che non risponde non tiene appeso il giro per 6 ore;
    # il giro piu' lungo misurato e' di 9 minuti
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Raccoglie dati Friuli OSMER
        id: collect
        run: node .github/scripts/collect-friuli-osmer.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
        continue-on-error: true
      - name: Retry 1
        id: retry1
        if: steps.collect.outcome == 'failure'
        run: sleep 30 && node .github/scripts/collect-friuli-osmer.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
        continue-on-error: true
      - name: Retry 2
        if: steps.collect.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: sleep 60 && node .github/scripts/collect-friuli-osmer.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
      - name: Commit e push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          mkdir -p data/friuli-osmer
          git add data/friuli-osmer/
          git diff --staged --quiet || git commit -m "friuli-osmer $(date -u +%Y-%m-%d) [skip netlify]"
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            echo "Push fallito (tentativo $i/5), retry tra 10s..."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          [ "$ok" = "1" ] || { echo "Push fallito dopo 5 tentativi"; exit 1; }
