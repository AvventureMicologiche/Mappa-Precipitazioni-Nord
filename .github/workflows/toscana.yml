name: Collect Toscana

on:
  schedule:
    # Ogni giorno alle 13:30 UTC (15:30 ora italiana)
    - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scarica dati CFR Toscana
        run: |
          node .github/scripts/collect-toscana-gh.js

      - name: Commit e push dati
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/toscana/
          git diff --staged --quiet || git commit -m "data(toscana): $(date +'%Y-%m-%d') [bot]"
          git push
