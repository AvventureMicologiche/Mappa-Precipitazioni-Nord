name: Toscana
on:
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Data da raccogliere (YYYY-MM-DD, lascia vuoto per oggi)'
        required: false
        default: ''
  schedule:
    - cron: '15 0 * * *'
    - cron: '15 4 * * *'
    - cron: '15 8 * * *'
    - cron: '15 12 * * *'
    - cron: '15 16 * * *'
    - cron: '15 20 * * *'
    # ⚠️ CHIUSURE SPOSTATE DI 20 MINUTI IL 19/10/2026 (quinto check, bug 14): erano 20:40/21:00/21:20 UTC, cioe'
    # 22:40-23:20 d'estate ma 21:40-22:20 d'inverno, e la prima «chiudeva» la giornata con piu' di due ore ancora
    # da contare. Alle 21:00/21:20/21:40 UTC cadono alle 23:00-23:40 d'estate e alle 22:00-22:40 d'inverno: sempre
    # dopo le 22 e prima di mezzanotte. Le chiusure vere le lancia l'orologio su Cloudflare in ora italiana.
    - cron: '0 21 * * *'
    - cron: '20 21 * * *'
    - cron: '40 21 * * *'
env:
  # I 3 cron di chiusura serale disattivano la protezione glitch-0 nel collector
  # (bug #17): a fine giornata uno 0 da SIR è un dato reale, non un glitch.
  CLOSING: ${{ (github.event.schedule == '0 21 * * *' || github.event.schedule == '20 21 * * *' || github.event.schedule == '40 21 * * *') && '1' || '' }}
# ⚠️ IN FILA, MAI DUE INSIEME (5/10/2026): dal 5/10 l'orologio su Cloudflare lancia questo
# workflow anche lui, accanto ai cron di GitHub. Due giri insieme scriverebbero gli stessi
# file e il secondo fallirebbe al push. Cosi' il secondo aspetta che il primo finisca.
# GitHub tiene al massimo UN giro in attesa: se ne arriva un terzo, quello in attesa
# (identico) viene sostituito, quello in corso non si tocca mai.
# ⚠️ (19/10/2026, sesto check) NON era vero che il secondo «riparte dai dati del primo»:
# un giro in fila fa il checkout dello SHA fissato quando e' nato, non della punta di main,
# e il suo commit andava in conflitto. Ora riparte dalla punta grazie a `ref: main`.
concurrency:
  group: toscana
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    # tetto (21/10/2026): se il giro delle 22:15 restasse appeso 6 ore, le chiusure di Cloudflare
    # si cancellerebbero in coda e il giorno non si chiuderebbe piu'. Il giro dura meno di un minuto.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Raccoglie dati Toscana
        id: collect
        run: node .github/scripts/collect-toscana-sir.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
        continue-on-error: true
      - name: Retry 1
        id: retry1
        if: steps.collect.outcome == 'failure'
        run: sleep 30 && node .github/scripts/collect-toscana-sir.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
        continue-on-error: true
      - name: Retry 2
        if: steps.collect.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: sleep 60 && node .github/scripts/collect-toscana-sir.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
      - name: Commit e push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add data/toscana/
          git diff --staged --quiet || git commit -m "toscana $(date -u +%Y-%m-%d) [skip netlify]"
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            echo "Push fallito (tentativo $i/5), retry tra 10s..."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          # ⚠️ (19/10/2026, quinto check, bug 18) senza questa riga 5 push falliti finivano VERDI
          [ "$ok" = "1" ] || { echo "Push fallito dopo 5 tentativi"; exit 1; }
