name: Friuli
on:
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Data da raccogliere (YYYY-MM-DD, lascia vuoto per oggi)'
        required: false
        default: ''
  # DISATTIVATO 26/7/2026: il Friuli in mappa usa ARPA OSMER reale
  # (collect-friuli-osmer.js + friuli-osmer.yml). Questo collector Open-Meteo
  # resta lanciabile a mano (workflow_dispatch) ma non gira più in automatico.
  # schedule:
  #   - cron: '35 0 * * *'
  #   - cron: '35 4 * * *'
  #   - cron: '35 8 * * *'
  #   - cron: '35 12 * * *'
  #   - cron: '35 16 * * *'
  #   - cron: '35 20 * * *'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Raccoglie dati Friuli
        id: collect
        run: node .github/scripts/collect-friuli-gh.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
        continue-on-error: true
      - name: Retry 1
        if: steps.collect.outcome == 'failure'
        run: sleep 30 && node .github/scripts/collect-friuli-gh.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
        continue-on-error: true
      - name: Retry 2
        if: steps.collect.outcome == 'failure'
        run: sleep 60 && node .github/scripts/collect-friuli-gh.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
      - name: Commit e push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          mkdir -p data/friuli
          git add data/friuli/
          git diff --staged --quiet || git commit -m "friuli $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
