name: Friuli
on:
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Data da raccogliere (YYYY-MM-DD, lascia vuoto per oggi)'
        required: false
        default: ''
  schedule:
    - cron: '30 1 * * *'
    - cron: '30 5 * * *'
    - cron: '30 9 * * *'
    - cron: '30 13 * * *'
    - cron: '30 17 * * *'
    - cron: '30 21 * * *'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Raccoglie dati Friuli
        run: node .github/scripts/collect-friuli-gh.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
      - name: Commit e push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          mkdir -p data/friuli
          git add data/friuli/
          git diff --staged --quiet || git commit -m "friuli $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
