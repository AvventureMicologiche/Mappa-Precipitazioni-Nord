name: Fix Emilia offset
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fix offset +1 giorno
        run: node fix-emilia-offset.js
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/emilia/
          git commit -m "fix emilia: corretto offset +1 giorno su tutti i file storici"
          git push
