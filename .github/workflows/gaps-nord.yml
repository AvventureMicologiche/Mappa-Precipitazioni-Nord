name: Buchi Nord — copertura con stime ICON-2I
on:
  workflow_dispatch:
    inputs:
      scan_days:
        description: 'Giorni da scansionare (default 15; oltre gli ~8 giorni di ICON i buchi si segnano, non si coprono)'
        required: false
        default: '15'
      max_coperture:
        description: 'Massimo giorni coperti in un run (default 5)'
        required: false
        default: '5'
  schedule:
    # 1 run/giorno, dopo che tutti i collector del mattino hanno finito
    # (i cron di GitHub slittano di 40-70 minuti). Trova i giorni interamente
    # mancanti e, passata la grazia (3 giorni per tutti dal 26/10/2026), li copre
    # con le stime del modello ICON-2I sulle coordinate delle stazioni vere (fino
    # al 2/11/2026 Open-Meteo). Vedi .github/scripts/check-gaps-nord.js
    - cron: '10 9 * * *'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    # tetto (21/10/2026): una fonte che non risponde non tiene appeso il giro per 6 ore;
    # il giro piu' lungo misurato e' di 9 minuti
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Cerca e copri i buchi
        id: check
        env:
          SCAN_DAYS: ${{ github.event.inputs.scan_days || '15' }}
          MAX_COPERTURE: ${{ github.event.inputs.max_coperture || '5' }}
        run: node .github/scripts/check-gaps-nord.js
        continue-on-error: true
      - name: Retry 1
        if: steps.check.outcome == 'failure'
        env:
          SCAN_DAYS: ${{ github.event.inputs.scan_days || '15' }}
          MAX_COPERTURE: ${{ github.event.inputs.max_coperture || '5' }}
        run: sleep 60 && node .github/scripts/check-gaps-nord.js
      - name: Commit e push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add data/
          git diff --staged --quiet || git commit -m "gaps-nord $(date -u +%Y-%m-%d) [skip netlify]"
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            echo "Push fallito (tentativo $i/5), retry tra 10s..."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          [ "$ok" = "1" ] || { echo "Push fallito dopo 5 tentativi"; exit 1; }
