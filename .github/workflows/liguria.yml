name: Liguria
on:
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Data da raccogliere (YYYY-MM-DD, lascia vuoto per oggi)'
        required: false
        default: ''
  # ⚠️ DUE CRON E NON SEI (23/10/2026). Ogni giro riscrive solo IERI, e confrontando le versioni dei file
  # 19-21/10 la pioggia dopo il primo giro non cambiava (una sola correzione OMIRL di pomeriggio, -8 mm sulla
  # regione). Sei giri da ~550 richieste piu' la sveglia delle 4:30 facevano ~3.800 richieste al giorno a OMIRL,
  # che dal 22/10 sera non risponde piu' ai runner GitHub. Restano: la notte (il giorno appena chiuso), la sveglia
  # Cloudflare delle 4:30 italiane e il pomeriggio per le correzioni. Il guardiano copre i giri saltati.
  schedule:
    - cron: '45 23 * * *'
    - cron: '45 13 * * *'
# ⚠️ IN FILA, MAI DUE INSIEME (5/10/2026): dal 5/10 l'orologio su Cloudflare lancia questo
# workflow anche lui, accanto ai cron di GitHub. Due giri insieme scriverebbero gli stessi
# file e il secondo fallirebbe al push. Cosi' il secondo aspetta che il primo finisca.
# GitHub tiene al massimo UN giro in attesa: se ne arriva un terzo, quello in attesa
# (identico) viene sostituito, quello in corso non si tocca mai.
# ⚠️ (19/10/2026, sesto check) NON era vero che il secondo «riparte dai dati del primo»:
# un giro in fila fa il checkout dello SHA fissato quando e' nato, non della punta di main,
# e il suo commit andava in conflitto. Ora riparte dalla punta grazie a `ref: main`.
concurrency:
  group: liguria
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    # tetto (21/10/2026): una fonte che non risponde non tiene appeso il giro per 6 ore;
    # il giro piu' lungo misurato e' di 9 minuti
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Raccoglie dati Liguria
        id: collect
        run: node .github/scripts/collect-liguria.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
          OMIRL_TRAMITE: https://omirl-tramite.avventuremicologiche.workers.dev
          OMIRL_CHIAVE: ${{ secrets.OMIRL_CHIAVE }}
        continue-on-error: true
      - name: Retry 1
        id: retry1
        if: steps.collect.outcome == 'failure'
        run: sleep 30 && node .github/scripts/collect-liguria.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
          OMIRL_TRAMITE: https://omirl-tramite.avventuremicologiche.workers.dev
          OMIRL_CHIAVE: ${{ secrets.OMIRL_CHIAVE }}
        continue-on-error: true
      - name: Retry 2
        if: steps.collect.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: sleep 60 && node .github/scripts/collect-liguria.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
          OMIRL_TRAMITE: https://omirl-tramite.avventuremicologiche.workers.dev
          OMIRL_CHIAVE: ${{ secrets.OMIRL_CHIAVE }}
      - name: Commit e push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add data/liguria/
          git diff --staged --quiet || git commit -m "liguria $(date -u +%Y-%m-%d) [skip netlify]"
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            echo "Push fallito (tentativo $i/5), retry tra 10s..."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          # ⚠️ (19/10/2026, quinto check, bug 18) senza questa riga 5 push falliti finivano VERDI
          [ "$ok" = "1" ] || { echo "Push fallito dopo 5 tentativi"; exit 1; }
