name: Francia
on:
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Data da raccogliere (YYYY-MM-DD, lascia vuoto per ieri+altroieri)'
        required: false
        default: ''
  # PILOTA Francia INTERA (Météo-France, API Paquet Observations) — dal 9
  # agosto 2026, solo repo di test. Le 13 régions metropolitane, 95 pacchetti
  # dipartimento (la Corsica è id 20 unico), ~1.700 stazioni orarie, una
  # cartella data/francia-<régione> ciascuna. Un run dura ~5-6 minuti.
  # Ogni run raccoglie ieri + altroieri e auto-ripara D-3..D-4 se mancanti o
  # corti: il pacchetto orario contiene ~5 giorni (misurato, la doc dice 24h),
  # quindi la riparazione non costa niente. Oltre D-4 serve DPClim (manuale).
  # Il cron di CHIUSURA (22:50 UTC = 00:50 italiane) è il più importante: il
  # giorno solare italiano si chiude alle 22:00 UTC e l'API pubblica ogni ora
  # 10 minuti dopo l'ora tonda, quindi a quell'ora il totale di ieri è già
  # completo e definitivo — stessa logica del cron austriaco delle 22:40, che
  # ha passato il collaudo del 9/8. Orari sfalsati da Austria (x:40) e
  # Svizzera per non accavallare i push sullo stesso repo.
  # ⚠️ Serve il secret METEOFRANCE_API_KEY (chiave del portale
  # portail-api.meteofrance.fr, scade il 9/8/2028): senza, il collector esce
  # subito con errore esplicito.
  schedule:
    # ⚠️ +1 ORA IL 19/10/2026 (quinto check, bug 14): GitHub conta in UTC e non conosce l'ora legale. Alle 22:50 UTC
    # questo giro cadeva alle 00:50 d'estate ma alle 23:50 d'inverno, PRIMA della mezzanotte italiana, e non
    # chiudeva piu' il giorno. Alle 23:55 UTC cade alle 00:55 d'inverno e alle 01:55 d'estate: sempre dopo
    # mezzanotte. E' la RISERVA: il giorno lo chiude l'orologio su Cloudflare alle 00:45 italiane (sveglia-guardiano.js).
    - cron: '55 23 * * *'
    - cron: '25 3 * * *'
    - cron: '45 5 * * *'
    - cron: '25 13 * * *'
permissions:
  contents: write
# ⚠️ IN FILA, MAI DUE INSIEME (5/10/2026): dal 5/10 l'orologio su Cloudflare lancia questo
# workflow anche lui, accanto ai cron di GitHub. Due giri insieme scriverebbero gli stessi
# file e il secondo fallirebbe al push. Cosi' il secondo aspetta che il primo finisca.
# GitHub tiene al massimo UN giro in attesa: se ne arriva un terzo, quello in attesa
# (identico) viene sostituito, quello in corso non si tocca mai.
# ⚠️ (19/10/2026, sesto check) NON era vero che il secondo «riparte dai dati del primo»:
# un giro in fila fa il checkout dello SHA fissato quando e' nato, non della punta di main,
# e il suo commit andava in conflitto. Ora riparte dalla punta grazie a `ref: main`.
concurrency:
  group: francia
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Raccoglie dati Francia (Météo-France)
        id: collect
        run: node .github/scripts/collect-francia-meteofrance.js
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
          DATE_OVERRIDE: ${{ inputs.date_override }}
        continue-on-error: true
      - name: Retry 1
        id: retry1
        if: steps.collect.outcome == 'failure'
        run: sleep 30 && node .github/scripts/collect-francia-meteofrance.js
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
          DATE_OVERRIDE: ${{ inputs.date_override }}
        continue-on-error: true
      - name: Retry 2
        if: steps.collect.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: sleep 60 && node .github/scripts/collect-francia-meteofrance.js
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
          DATE_OVERRIDE: ${{ inputs.date_override }}
      - name: Commit e push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add data/francia-*
          git diff --staged --quiet || git commit -m "francia $(date -u +%Y-%m-%d) [skip netlify]"
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            echo "Push fallito (tentativo $i/5), retry tra 10s..."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          [ "$ok" = "1" ] || { echo "Push fallito dopo 5 tentativi"; exit 1; }
