name: Fix Liguria storico
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ri-scarica 19-20 giugno
        run: |
          DATE_OVERRIDE=2026-06-19 node .github/scripts/collect-liguria.js || echo "Skip 19 (errore)"
          DATE_OVERRIDE=2026-06-20 node .github/scripts/collect-liguria.js || echo "Skip 20 (errore)"
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/liguria/
          git diff --cached --quiet && echo "Nessuna modifica" || (git commit -m "fix liguria: riscritti 19-20 giugno con charts endpoint" && git push)
