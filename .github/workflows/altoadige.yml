name: Alto Adige
on:
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Data da raccogliere (YYYY-MM-DD, lascia vuoto per oggi)'
        required: false
        default: ''
  schedule:
    - cron: '25 0 * * *'
    - cron: '25 4 * * *'
    - cron: '25 8 * * *'
    - cron: '25 12 * * *'
    - cron: '25 16 * * *'
    - cron: '25 20 * * *'
    # Run di chiusura giornata: anticipato dalle 21:55 alle 21:05 UTC perché i
    # cron di GitHub slittano di 40-70 minuti e atterrava dopo mezzanotte CEST
    - cron: '05 21 * * *'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Raccoglie dati Alto Adige
        id: collect
        run: node .github/scripts/collect-altoadige-gh.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
        continue-on-error: true
      - name: Retry 1
        if: steps.collect.outcome == 'failure'
        run: sleep 30 && node .github/scripts/collect-altoadige-gh.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
        continue-on-error: true
      - name: Retry 2
        if: steps.collect.outcome == 'failure'
        run: sleep 60 && node .github/scripts/collect-altoadige-gh.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
      - name: Commit e push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          mkdir -p data/altoadige
          git add data/altoadige/
          git diff --staged --quiet || git commit -m "altoadige $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push fallito (tentativo $i/5), retry tra 10s..."
            sleep 10
          done
