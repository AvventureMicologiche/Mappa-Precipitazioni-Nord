name: Alto Adige
on:
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Data da raccogliere (YYYY-MM-DD, lascia vuoto per oggi)'
        required: false
        default: ''
  schedule:
    - cron: '25 0 * * *'
    - cron: '25 4 * * *'
    - cron: '25 8 * * *'
    - cron: '25 12 * * *'
    - cron: '25 16 * * *'
    - cron: '25 20 * * *'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Raccoglie dati Alto Adige
        id: collect
        run: node .github/scripts/collect-altoadige-gh.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
        continue-on-error: true
      - name: Retry 1
        if: steps.collect.outcome == 'failure'
        run: sleep 30 && node .github/scripts/collect-altoadige-gh.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
        continue-on-error: true
      - name: Retry 2
        if: steps.collect.outcome == 'failure'
        run: sleep 60 && node .github/scripts/collect-altoadige-gh.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
      - name: Commit e push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          mkdir -p data/altoadige
          git add data/altoadige/
          git diff --staged --quiet || git commit -m "altoadige $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
