name: Riepiloghi delle pagine regione e delle pagine funghi
on:
  workflow_dispatch:
  schedule:
    # QUATTRO giri, tutti al mattino (orari UTC; in italiane +2 d'estate).
    # ⚠️ PERCHE' NON PIU' IL GIRO DELL'01:20 (cambiato il 15/9/2026). Dal 13/9
    #    «ieri» si scrive solo se il giorno e' completo, e prima delle 5
    #    italiane non lo e' mai: il giro di notte, che GitHub faceva partire
    #    alle 3, non portava avanti niente. Tutto dipendeva dal solo giro delle
    #    7:10, e il 14/9 GitHub l'ha fatto partire alle 12:32 (col guardiano
    #    anche lui in ritardo di tre-sei ore): pagine su «altroieri» fino a
    #    pranzo. Quindi piu' giri, al mattino, a distanza fra loro. Se trovano
    #    i riepiloghi gia' aggiornati non riscrivono niente: costano zero.
    #  03:30 UTC (05:30) il primo che puo' portare «ieri» al giorno giusto;
    #  04:45 UTC (06:45) riserva;
    #  05:10 UTC (07:10) quello di sempre, allineato alle anteprime (05:40);
    #  06:40 UTC (08:40) riserva;
    #  09:15 UTC (11:15) per l'EMILIA (aggiunto il 15/9/2026): ARPAE completa
    #    la giornata di ieri a volte alle 6:30 e a volte verso le 11 (il 15/9
    #    alle 8 c'erano 14 stazioni su 322). Senza questo giro, nei giorni
    #    lenti l'Emilia e le sue zone restavano su altroieri fino al mattino dopo.
    # I minuti sono scelti dove non parte nessun altro workflow.
    - cron: '30 3 * * *'
    - cron: '45 4 * * *'
    - cron: '10 5 * * *'
    - cron: '40 6 * * *'
    - cron: '15 9 * * *'
permissions:
  contents: write
  actions: write   # per lanciare pagine-regione.yml, vedi l'ultimo passo
# ⚠️ IN FILA, MAI DUE INSIEME (4/10/2026): dal 4/10 il guardiano li rilancia
# anche fuori orario (sveglia Cloudflare), e due giri paralleli riscrivono gli
# stessi file: il secondo andrebbe in conflitto al rebase del push.
concurrency:
  group: riepiloghi
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Nessuna rete: legge i file gia' nel checkout e scrive 23 JSON da ~1,5 KB.
      # Sul portatile ci mette 0,7 secondi in tutto.
      - name: Genera i riepiloghi
        run: node .github/scripts/genera-riepiloghi.js
      # Stessa medicina per le pagine «Piogge per funghi», ma un file diverso:
      # il riepilogo e' della REGIONE, qui serve una riga per POSTO. Anche
      # questo senza rete, 0,4 secondi, 19 JSON da 33 KB in tutto.
      - name: Genera i numeri delle pagine funghi
        run: node .github/scripts/genera-funghi.js
      # Le minime e massime di IERI verificate coi vicini, per il tasto «🌡 Temp. ieri» della
      # mappa (3/10/2026): anche questo senza rete, legge i file del giorno gia' nel checkout.
      - name: Genera le temperature di ieri
        run: node .github/scripts/genera-temperature-ieri.js
      # ⚠️ `data/` e' nella regola ignore di netlify.toml: questo commit NON fa
      # partire nessun deploy, come per i collector. Se un giorno i riepiloghi
      # si spostassero fuori da `data/`, ogni giro comincerebbe a costare ~15
      # crediti Netlify.
      - name: Commit e push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add data/riepiloghi/ data/funghi/ data/temperature-ieri.json
          git diff --staged --quiet || git commit -m "riepiloghi pagine regione e funghi $(date -u +%Y-%m-%d) [skip netlify]"
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            echo "Push fallito (tentativo $i/5), retry tra 10s..."
            sleep 10
          done
          [ "$ok" = "1" ] || { echo "Push fallito dopo 5 tentativi"; exit 1; }
      # Le temperature IMPOSSIBILI (4/10/2026): minima o massima a piu' di 15 gradi dalla
      # mediana dei vicini -> la giornata perde `t` e nel grafico c'e' il trattino. Ripassa gli
      # ultimi 11 giorni, cosi' prende anche i file che un collector ha riscritto dopo.
      # ⚠️ 11 E NON 3 (19/10/2026): Piemonte riscrive D-3 la sera, Svizzera, Austria e Slovenia
      # fino a D-10. Con 3 giorni il 14/10 di Front Malone (47,7°) e' stato riscritto il 17 sera
      # e il giro del 18 non ci passava piu'. Legge solo i nostri file: pochi secondi.
      # ⚠️ DOPO il push dei riepiloghi e con un commit SUO: tocca i file del giorno, che i
      # collector riscrivono, e un conflitto al rebase qui non deve costare i riepiloghi.
      # Se il push non riesce si lascia perdere: il giro dopo ripassa gli stessi giorni.
      - name: Togli le temperature impossibili
        continue-on-error: true
        run: |
          GIORNI=11 node .github/scripts/pulisci-temperature.js
          git add -u data/
          git diff --staged --quiet && exit 0
          git commit -m "temperature impossibili $(date -u +%Y-%m-%d) [skip netlify]"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "Push delle temperature non riuscito: ci ripensa il giro dopo"
      # Le pagine regione cotte si rigenerano dopo OGNI giro dei riepiloghi (12/10/2026).
      # ⚠️ Le lancia questo passo e non un `workflow_run` in pagine-regione.yml: i giri
      # rilanciati dal guardiano nascono dal GITHUB_TOKEN, e GitHub non crea run dagli
      # eventi di quel token (il 12/10 i giri delle 6:30 e 7:30 non le hanno fatte
      # partire). workflow_dispatch e' l'eccezione documentata, come nel guardiano.
      # Pubblicano su Pages solo se le pagine sono cambiate.
      - name: Lancia le pagine regione cotte
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pagine-regione.yml -R "$GITHUB_REPOSITORY" -f pubblica=se-cambiate
