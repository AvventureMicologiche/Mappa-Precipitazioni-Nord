name: Svizzera
on:
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Data da raccogliere (YYYY-MM-DD, lascia vuoto per ieri+altroieri)'
        required: false
        default: ''
  # Svizzera intera (MeteoSwiss OGD) — in PRODUZIONE dal 3 agosto 2026 (v6.0).
  # Ogni run raccoglie ieri + altroieri e auto-ripara i giorni 3..10 se mancanti
  # (il file "recent" copre l'intero anno: la riparazione non costa richieste extra).
  # Il run delle 02:20 UTC è opportunistico: se il recent non copre ancora tutto
  # ieri, la soglia MIN_ORE evita scritture parziali e ci pensa il run delle 04:50
  # (alle 06:17 UTC il recent aveva già tutte le ore di ieri, verificato il 3/8).
  # Quello delle 12:40 gira dopo il refresh ufficiale delle 12 UTC.
  schedule:
    - cron: '20 2 * * *'
    - cron: '50 4 * * *'
    - cron: '40 7 * * *'
    - cron: '40 12 * * *'
    - cron: '10 17 * * *'
permissions:
  contents: write
# ⚠️ IN FILA, MAI DUE INSIEME (5/10/2026): dal 5/10 l'orologio su Cloudflare lancia questo
# workflow anche lui, accanto ai cron di GitHub. Due giri insieme scriverebbero gli stessi
# file e il secondo fallirebbe al push. Cosi' il secondo aspetta che il primo finisca.
# GitHub tiene al massimo UN giro in attesa: se ne arriva un terzo, quello in attesa
# (identico) viene sostituito, quello in corso non si tocca mai.
# ⚠️ (19/10/2026, sesto check) NON era vero che il secondo «riparte dai dati del primo»:
# un giro in fila fa il checkout dello SHA fissato quando e' nato, non della punta di main,
# e il suo commit andava in conflitto. Ora riparte dalla punta grazie a `ref: main`.
concurrency:
  group: svizzera
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    # tetto (21/10/2026): una fonte che non risponde non tiene appeso il giro per 6 ore;
    # il giro piu' lungo misurato e' di 9 minuti
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Raccoglie dati Svizzera (MeteoSwiss)
        id: collect
        run: node .github/scripts/collect-svizzera-meteoswiss.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
        continue-on-error: true
      - name: Retry 1
        id: retry1
        if: steps.collect.outcome == 'failure'
        run: sleep 30 && node .github/scripts/collect-svizzera-meteoswiss.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
        continue-on-error: true
      - name: Retry 2
        if: steps.collect.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: sleep 60 && node .github/scripts/collect-svizzera-meteoswiss.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
      - name: Commit e push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          mkdir -p data/svizzera
          git add data/svizzera/
          git diff --staged --quiet || git commit -m "svizzera $(date -u +%Y-%m-%d) [skip netlify]"
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            echo "Push fallito (tentativo $i/5), retry tra 10s..."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          [ "$ok" = "1" ] || { echo "Push fallito dopo 5 tentativi"; exit 1; }
