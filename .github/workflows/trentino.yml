name: Trentino
on:
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Data da raccogliere (YYYY-MM-DD, lascia vuoto per oggi)'
        required: false
        default: ''
  schedule:
    - cron: '20 0 * * *'
    - cron: '20 4 * * *'
    - cron: '20 8 * * *'
    - cron: '20 12 * * *'
    - cron: '20 16 * * *'
    - cron: '20 20 * * *'
    # Run dopo la mezzanotte locale: l'API pubblica l'aggregato di un giorno solo
    # a giornata conclusa, questo lo raccoglie prima del primo run del mattino
    # ⚠️ +1 ORA IL 19/10/2026 (quinto check, bug 14): GitHub conta in UTC e non conosce l'ora legale. Alle 22:30 UTC
    # questo giro cadeva alle 00:30 d'estate ma alle 23:30 d'inverno, PRIMA della mezzanotte italiana, e non
    # chiudeva piu' il giorno. Alle 23:30 UTC cade alle 00:30 d'inverno e alle 01:30 d'estate: sempre dopo
    # mezzanotte. E' la RISERVA: il giorno lo chiude l'orologio su Cloudflare alle 00:45 italiane (sveglia-guardiano.js).
    - cron: '30 23 * * *'
# ⚠️ IN FILA, MAI DUE INSIEME (5/10/2026): dal 5/10 l'orologio su Cloudflare lancia questo
# workflow anche lui, accanto ai cron di GitHub. Due giri insieme scriverebbero gli stessi
# file e il secondo fallirebbe al push. Cosi' il secondo aspetta che il primo finisca.
# GitHub tiene al massimo UN giro in attesa: se ne arriva un terzo, quello in attesa
# (identico) viene sostituito, quello in corso non si tocca mai.
# ⚠️ (19/10/2026, sesto check) NON era vero che il secondo «riparte dai dati del primo»:
# un giro in fila fa il checkout dello SHA fissato quando e' nato, non della punta di main,
# e il suo commit andava in conflitto. Ora riparte dalla punta grazie a `ref: main`.
concurrency:
  group: trentino
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    # tetto (21/10/2026): una fonte che non risponde non tiene appeso il giro per 6 ore;
    # il giro piu' lungo misurato e' di 9 minuti
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Raccoglie dati Trentino
        id: collect
        run: node .github/scripts/collect-trentino-gh.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
        continue-on-error: true
      - name: Retry 1
        id: retry1
        if: steps.collect.outcome == 'failure'
        run: sleep 30 && node .github/scripts/collect-trentino-gh.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
        continue-on-error: true
      - name: Retry 2
        if: steps.collect.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: sleep 60 && node .github/scripts/collect-trentino-gh.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
      - name: Commit e push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add data/trentino/
          git diff --staged --quiet || git commit -m "trentino $(date -u +%Y-%m-%d) [skip netlify]"
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            echo "Push fallito (tentativo $i/5), retry tra 10s..."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          # ⚠️ (19/10/2026, quinto check, bug 18) senza questa riga 5 push falliti finivano VERDI
          [ "$ok" = "1" ] || { echo "Push fallito dopo 5 tentativi"; exit 1; }
