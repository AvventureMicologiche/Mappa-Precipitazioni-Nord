name: Austria
on:
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Data da raccogliere (YYYY-MM-DD, lascia vuoto per ieri+altroieri)'
        required: false
        default: ''
  # Austria (GeoSphere Austria Data Hub) — IN PRODUZIONE dal 7 agosto 2026,
  # sviluppata nel repo di test dal 5/8. Il collector del test resta attivo:
  # il sito di test legge l Austria dal proprio repo, come per la Svizzera.
  # Ogni run raccoglie ieri + altroieri e auto-ripara i giorni 3..10 se mancanti o
  # corti: l'archivio orario risponde su qualsiasi data, quindi la riparazione non
  # costa niente e un run fallito non perde mai dati (come Svizzera e OASI).
  # Orari sfalsati da quelli svizzeri per non accavallare i push sullo stesso repo.
  # Il dato orario dell'ultima ora di ieri è disponibile poco dopo mezzanotte
  # (verificato il 5/8: l'API era già alle 17:00 dello stesso giorno); se le ore
  # non bastano, MIN_ORE=20 evita la scrittura parziale e ci pensa il giro dopo.
  # Il cron di CHIUSURA (22:40 UTC = 00:40 italiane) è il più importante: il
  # giorno solare italiano si chiude alle 22:00 UTC e l'API GeoSphere è quasi
  # in tempo reale, quindi 40 minuti dopo il totale di ieri è già completo e
  # definitivo. Senza, il primo run utile sarebbe quello delle 03:10 che coi
  # ritardi di GitHub (40-70 min) diventa ~05:00 UTC: per tutta la notte e la
  # prima mattina l'Austria risulterebbe SENZA "ieri" in mappa — la stessa
  # finestra buia che il Trentino aveva col bug #19, chiusa allo stesso modo.
  # Aggiunto il 6/8/2026 dopo che il buco si è visto dal vivo.
  schedule:
    # ⚠️ RISERVE DELLA SVEGLIA (27/10/2026, fase 1 dell'alleggerimento delle fonti): i giri veri li lancia
    # l'orologio su Cloudflare alle 0:45 e alle 4:30 italiane; qui restano la notte e un giro nel pomeriggio.
    # ⚠️ +1 ORA IL 19/10/2026 (quinto check, bug 14): GitHub conta in UTC e non conosce l'ora legale. Alle 22:40 UTC
    # questo giro cadeva alle 00:40 d'estate ma alle 23:40 d'inverno, PRIMA della mezzanotte italiana, e non
    # chiudeva piu' il giorno. Alle 23:40 UTC cade alle 00:40 d'inverno e alle 01:40 d'estate: sempre dopo
    # mezzanotte. E' la RISERVA: il giorno lo chiude l'orologio su Cloudflare alle 00:45 italiane (sveglia-guardiano.js).
    - cron: '40 23 * * *'
    - cron: '10 13 * * *'
permissions:
  contents: write
# ⚠️ IN FILA, MAI DUE INSIEME (5/10/2026): dal 5/10 l'orologio su Cloudflare lancia questo
# workflow anche lui, accanto ai cron di GitHub. Due giri insieme scriverebbero gli stessi
# file e il secondo fallirebbe al push. Cosi' il secondo aspetta che il primo finisca.
# GitHub tiene al massimo UN giro in attesa: se ne arriva un terzo, quello in attesa
# (identico) viene sostituito, quello in corso non si tocca mai.
# ⚠️ (19/10/2026, sesto check) NON era vero che il secondo «riparte dai dati del primo»:
# un giro in fila fa il checkout dello SHA fissato quando e' nato, non della punta di main,
# e il suo commit andava in conflitto. Ora riparte dalla punta grazie a `ref: main`.
concurrency:
  group: austria
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    # tetto (21/10/2026): una fonte che non risponde non tiene appeso il giro per 6 ore;
    # il giro piu' lungo misurato e' di 9 minuti
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Raccoglie dati Austria (GeoSphere)
        id: collect
        run: node .github/scripts/collect-austria-geosphere.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
        continue-on-error: true
      - name: Retry 1
        id: retry1
        if: steps.collect.outcome == 'failure'
        run: sleep 30 && node .github/scripts/collect-austria-geosphere.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
        continue-on-error: true
      - name: Retry 2
        if: steps.collect.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: sleep 60 && node .github/scripts/collect-austria-geosphere.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
      - name: Commit e push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          mkdir -p data/austria
          git add data/austria/
          git diff --staged --quiet || git commit -m "austria $(date -u +%Y-%m-%d) [skip netlify]"
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            echo "Push fallito (tentativo $i/5), retry tra 10s..."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          [ "$ok" = "1" ] || { echo "Push fallito dopo 5 tentativi"; exit 1; }
