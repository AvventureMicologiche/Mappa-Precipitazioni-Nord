name: Veneto
on:
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Data da raccogliere (YYYY-MM-DD, lascia vuoto per oggi)'
        required: false
        default: ''
  schedule:
    - cron: '10 0 * * *'
    - cron: '10 4 * * *'
    - cron: '10 8 * * *'
    - cron: '10 12 * * *'
    - cron: '10 16 * * *'
    - cron: '10 20 * * *'
# ⚠️ IN FILA, MAI DUE INSIEME (5/10/2026): dal 5/10 l'orologio su Cloudflare lancia questo
# workflow anche lui, accanto ai cron di GitHub. Due giri insieme scriverebbero gli stessi
# file e il secondo fallirebbe al push. Cosi' il secondo aspetta che il primo finisca e
# riparte dai suoi dati. GitHub tiene al massimo UN giro in attesa: se ne arriva un terzo,
# quello in attesa (identico) viene sostituito, quello in corso non si tocca mai.
concurrency:
  group: veneto
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Raccoglie dati Veneto
        id: collect
        run: node .github/scripts/collect-veneto.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
        continue-on-error: true
      - name: Retry 1
        if: steps.collect.outcome == 'failure'
        run: sleep 30 && node .github/scripts/collect-veneto.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
        continue-on-error: true
      - name: Retry 2
        if: steps.collect.outcome == 'failure'
        run: sleep 60 && node .github/scripts/collect-veneto.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
      - name: Commit e push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add data/veneto/
          git diff --staged --quiet || git commit -m "veneto $(date -u +%Y-%m-%d) [skip netlify]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push fallito (tentativo $i/5), retry tra 10s..."
            sleep 10
          done
