name: Valle d'Aosta CF (pilota)
on:
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Data da raccogliere (YYYY-MM-DD, lascia vuoto per ultimi 7 giorni)'
        required: false
        default: ''
  schedule:
    # Dati REALI Centro Funzionale VdA, in valutazione per sostituire Open-Meteo.
    # Ogni run copre ieri + auto-riparazione della settimana (una chiamata per
    # stazione con intervallo). Il valore giornaliero è stabile a giorno chiuso,
    # bastano 2 run. Orari sfalsati da meteohub.yml (xx:50) e ticino.
    # Run mattutini ridondanti (i cron GitHub slittano): "ieri" pronto presto.
    #
    # ⚠️ CHIUSURA DEL GIORNO (26/8/2026). Senza questa riga il primo run era
    # quello delle 02:30 UTC che, coi ritardi di GitHub, atterrava alle 05:30
    # italiane: dalla mezzanotte alle cinque e mezza la Valle d'Aosta non aveva
    # "ieri" in mappa. È la stessa finestra buia già chiusa per l'Austria
    # (22:40) e per il Trentino. Il giorno solare italiano finisce alle 22:00
    # UTC e la fonte VdA aggrega in CONTINUO (verificato il 26/8: alle 05:37
    # italiane restituiva già il totale giornaliero di quel giorno stesso),
    # quindi 45 minuti dopo la chiusura il totale di ieri è completo. Le 22:40
    # sono già dell'Austria e le 22:50 della Francia: qui si usa 22:45.
    - cron: '45 22 * * *'
    - cron: '30 2 * * *'
    - cron: '30 4 * * *'
    - cron: '30 7 * * *'
    - cron: '15 12 * * *'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Raccoglie dati Valle d'Aosta CF
        id: collect
        run: node .github/scripts/collect-valledaosta-cf.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
        continue-on-error: true
      - name: Retry 1
        if: steps.collect.outcome == 'failure'
        run: sleep 30 && node .github/scripts/collect-valledaosta-cf.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
        continue-on-error: true
      - name: Retry 2
        if: steps.collect.outcome == 'failure'
        run: sleep 60 && node .github/scripts/collect-valledaosta-cf.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
      - name: Commit e push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          mkdir -p data/valledaosta-cf
          git add data/valledaosta-cf/
          git diff --staged --quiet || git commit -m "valledaosta-cf $(date -u +%Y-%m-%d)"
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            echo "Push fallito (tentativo $i/5), retry tra 10s..."
            sleep 10
          done
          [ "$ok" = "1" ] || { echo "Push fallito dopo 5 tentativi"; exit 1; }
