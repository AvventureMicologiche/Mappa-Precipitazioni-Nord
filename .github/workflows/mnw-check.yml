name: Controllo MeteoNetwork sul centro-sud
# UN TESTIMONE INDIPENDENTE per le dieci regioni MeteoHub. Perche' serve, come
# giudica e cosa NON deve diventare: tutto scritto in .github/scripts/check-mnw-sud.js.
#
# UNA VOLTA A SETTIMANA, non ogni giorno. Le contraddizioni vere sono rare (su
# 45 giorni di collaudo: 25 aperte e UN caso confermato da tre fonti) e non si
# corregge niente in automatico, quindi guardarle il lunedi' o il martedi' non
# cambia nulla. Il lunedi' alle 10:53 UTC: i collector del mattino hanno chiuso
# da un pezzo e il minuto sparso tiene il run fuori dalle code di GitHub.
#
# FINESTRA DI 30 GIORNI, che e' anche il minimo sensato: la reputazione dei
# testimoni vuole almeno 20 giorni di storia per giudicare un pluviometro.
#
# ⚠️ NON TOCCA UN SOLO DATO. Scrive il registro data/mnw-check.json e, solo per
# i casi nuovi in cui manca pioggia ai nostri dati E lo conferma anche la terza
# fonte, manda una mail. Zero crediti Netlify: `data` e `.github` sono esclusi
# dal build in netlify.toml.
on:
  workflow_dispatch:
    inputs:
      da:
        description: 'Primo giorno (AAAA-MM-GG). Vuoto = 30 giorni fa'
        required: false
        default: ''
      a:
        description: 'Ultimo giorno (AAAA-MM-GG). Vuoto = ieri'
        required: false
        default: ''
      test_mail:
        description: 'Manda una mail di prova (non tocca il registro)'
        type: boolean
        default: false
  schedule:
    - cron: '53 10 * * 1'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Controllo
        id: check
        env:
          # Oltre gli 8 giorni l'archivio MeteoHub vuole l'account.
          MH_USER: ${{ secrets.MH_USER }}
          MH_PASS: ${{ secrets.MH_PASS }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TEST_MAIL: ${{ inputs.test_mail && '1' || '0' }}
          EML: ${{ runner.temp }}/mnw-mail.eml
          DA: ${{ inputs.da }}
          A: ${{ inputs.a }}
        run: |
          set -o pipefail
          [ -n "$DA" ] || DA=$(date -u -d '30 days ago' +%F)
          [ -n "$A" ]  || A=$(date -u -d 'yesterday' +%F)
          echo "finestra: $DA → $A"
          node .github/scripts/check-mnw-sud.js "$DA" "$A" | tee "$RUNNER_TEMP/mnw-check.log"

      # L'invio e' fatto con curl, non con un'action di terzi: cosi' la password
      # per le app di Gmail non esce mai dal runner. Lo script ha gia' scritto il
      # messaggio completo, intestazioni comprese. Stessa ricetta di alert-fonti.yml.
      - name: Manda la mail
        if: steps.check.outputs.mail == 'true'
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ -z "$MAIL_USER" ] || [ -z "$MAIL_PASS" ] || [ -z "$MAIL_TO" ]; then
            echo "::error::Mancano i secret MAIL_USER / MAIL_PASS / MAIL_TO: la mail non parte."
            exit 1
          fi
          ok=0
          for i in 1 2 3; do
            if curl --silent --show-error --ssl-reqd \
                 --url 'smtps://smtp.gmail.com:465' \
                 --user "$MAIL_USER:$MAIL_PASS" \
                 --mail-from "$MAIL_USER" \
                 --mail-rcpt "$MAIL_TO" \
                 --upload-file "$RUNNER_TEMP/mnw-mail.eml"; then ok=1; break; fi
            echo "Invio fallito (tentativo $i/3), riprovo fra 20s..."
            sleep 20
          done
          [ "$ok" = "1" ] || { echo "::error::Mail non inviata dopo 3 tentativi"; exit 1; }
          echo "Mail inviata."

      - name: Commit del registro
        if: steps.check.outputs.registro == 'true'
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add data/mnw-check.json
          git diff --staged --quiet || git commit -m "mnw-check $(date -u +%Y-%m-%d)"
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            echo "Push fallito (tentativo $i/5), retry tra 10s..."
            sleep 10
          done
          [ "$ok" = "1" ] || { echo "Push fallito dopo 5 tentativi"; exit 1; }

      - name: Resoconto del run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnw-check
          path: ${{ runner.temp }}/mnw-check.log
          if-no-files-found: warn
          retention-days: 30
