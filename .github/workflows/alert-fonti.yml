name: Alert fonti — regioni ferme
on:
  workflow_dispatch:
    inputs:
      test_mail:
        description: 'Manda una mail di prova (non tocca il registro)'
        type: boolean
        default: false
      simula:
        description: "Finge una regione ferma, es. liguria:4 (non tocca il registro)"
        required: false
        default: ''
  schedule:
    # 1 run/giorno, dopo i collector del mattino. Nessun vincolo di ordine con
    # gaps-nord (09:10): questo controllo ignora i file di stima, quindi non
    # importa chi dei due arriva prima. Vedi .github/scripts/check-fonti.js
    - cron: '30 9 * * *'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Controlla le fonti
        id: check
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TEST_MAIL: ${{ inputs.test_mail && '1' || '0' }}
          SIMULA: ${{ inputs.simula }}
        run: node .github/scripts/check-fonti.js

      # L'invio è fatto con curl, non con un'action di terzi: così la password
      # per le app di Gmail non esce mai dal runner. Lo script ha già scritto
      # il messaggio completo (intestazioni comprese) in alert-mail.eml.
      - name: Manda la mail
        if: steps.check.outputs.mail == 'true'
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ -z "$MAIL_USER" ] || [ -z "$MAIL_PASS" ] || [ -z "$MAIL_TO" ]; then
            echo "::error::Mancano i secret MAIL_USER / MAIL_PASS / MAIL_TO: la mail non parte."
            exit 1
          fi
          ok=0
          for i in 1 2 3; do
            if curl --silent --show-error --ssl-reqd \
                 --url 'smtps://smtp.gmail.com:465' \
                 --user "$MAIL_USER:$MAIL_PASS" \
                 --mail-from "$MAIL_USER" \
                 --mail-rcpt "$MAIL_TO" \
                 --upload-file alert-mail.eml; then ok=1; break; fi
            echo "Invio fallito (tentativo $i/3), riprovo fra 20s..."
            sleep 20
          done
          [ "$ok" = "1" ] || { echo "::error::Mail non inviata dopo 3 tentativi"; exit 1; }
          echo "Mail inviata."

      - name: Commit del registro
        if: steps.check.outputs.registro == 'true'
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add data/alert-fonti.json
          git diff --staged --quiet || git commit -m "alert-fonti $(date -u +%Y-%m-%d)"
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            echo "Push fallito (tentativo $i/5), retry tra 10s..."
            sleep 10
          done
          [ "$ok" = "1" ] || { echo "Push fallito dopo 5 tentativi"; exit 1; }
