name: Emilia
on:
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Data da raccogliere (YYYY-MM-DD, lascia vuoto per oggi)'
        required: false
        default: ''
  schedule:
    - cron: '5 0 * * *'
    - cron: '5 4 * * *'
    # 06:30 UTC = 08:30 italiane, aggiunto il 27/8/2026.
    # ⚠️ ARPAE pubblica la giornata di IERI verso le 06:00 UTC (misurato dal
    # campo _updated dell'API: il 27/8 era 06:01). Il primo giro utile era
    # quello delle 08:05 UTC, cioe' le 10:05 italiane: ogni mattina l'Emilia
    # arrivava in mappa con due ore di ritardo rispetto a quando il dato
    # esisteva gia'. Il giro delle 00:05 e quello delle 04:05 non possono
    # trovare niente e restano solo come rete di sicurezza.
    - cron: '30 6 * * *'
    - cron: '5 8 * * *'
    - cron: '5 12 * * *'
    - cron: '5 16 * * *'
    - cron: '5 20 * * *'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Raccoglie dati Emilia
        id: collect
        run: node .github/scripts/collect-emilia.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
        continue-on-error: true
      - name: Retry 1
        if: steps.collect.outcome == 'failure'
        run: sleep 30 && node .github/scripts/collect-emilia.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
        continue-on-error: true
      - name: Retry 2
        if: steps.collect.outcome == 'failure'
        run: sleep 60 && node .github/scripts/collect-emilia.js
        env:
          DATE_OVERRIDE: ${{ inputs.date_override }}
      - name: Commit e push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add data/emilia/
          git diff --staged --quiet || git commit -m "emilia $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push fallito (tentativo $i/5), retry tra 10s..."
            sleep 10
          done
